<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="ext-resource-dependency" content="assets/logos/ax-wordmark.png">
<meta name="ext-resource-dependency" content="assets/logos/ax-wordmark-white.png">
<meta name="ext-resource-dependency" content="assets/sample-certificate.png">
<title>Your Apostille Application — ApostilleXpress</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="ds/tokens/fonts.css">
<link rel="stylesheet" href="ds/tokens/colors.css">
<link rel="stylesheet" href="ds/tokens/typography.css">
<link rel="stylesheet" href="ds/tokens/spacing.css">
<link rel="stylesheet" href="ds/tokens/shadows.css">
<link rel="stylesheet" href="ds/tokens/base.css">
<link rel="stylesheet" href="ds/components.css">
<link rel="stylesheet" href="ds/styles.css">
<script src="ds/_ds_bundle.js"></script>
<script src="./statesData.js"></script>
<script src="./orderData.js"></script>
<link rel="stylesheet" href="ax-overlays.css">
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--ax-font-base);color:var(--ax-text-primary);background:var(--ax-surface-page);min-height:100vh}
/* ---- Top bar ---- */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:36px;height:72px;padding:0 40px;background:var(--ax-surface-card);border-bottom:1px solid var(--ax-border-subtle)}
.tb-logo{display:flex;align-items:center;flex-shrink:0}
.tb-nav{display:flex;align-items:center;gap:28px;flex:1}
.tb-link{display:inline-flex;align-items:center;gap:8px;font-size:16px;font-weight:500;color:var(--ax-text-tertiary);text-decoration:none;background:none;border:none;font-family:inherit;cursor:pointer;padding:0;transition:color .15s ease}
.tb-link i{font-size:18px}
.tb-link:hover{color:var(--ax-text-primary)}
.tb-link.active{color:var(--ax-sea-depths);font-weight:600}
.tb-profile{display:inline-flex;align-items:center;gap:10px;flex-shrink:0;font-size:16px;font-weight:500;color:var(--ax-text-primary)}
.tb-profile i.bi-person-circle{font-size:22px;color:var(--ax-text-tertiary)}
.tb-profile i.bi-chevron-down{font-size:14px;color:var(--ax-text-tertiary)}
.tb-profile-wrap{position:relative;flex-shrink:0}
.tb-profile-btn{display:inline-flex;align-items:center;gap:10px;font-size:16px;font-weight:500;color:var(--ax-text-primary);background:none;border:none;font-family:inherit;cursor:pointer;padding:6px 8px;border-radius:8px;transition:background .12s ease}
.tb-profile-btn:hover{background:var(--ax-gray-50)}
.tb-profile-btn i.bi-person-circle{font-size:22px;color:var(--ax-text-tertiary)}
.tb-profile-btn i.bi-chevron-down{font-size:14px;color:var(--ax-text-tertiary);transition:transform .15s ease}
.tb-profile-btn[aria-expanded="true"] i.bi-chevron-down{transform:rotate(180deg)}
.tb-menu{position:absolute;top:calc(100% + 10px);right:0;min-width:240px;background:var(--ax-surface-card);border:1px solid var(--ax-border-subtle);border-radius:12px;box-shadow:0 12px 24px -8px rgba(10,13,18,.18);padding:8px;z-index:40}
.tb-menu-item{display:flex;align-items:center;gap:13px;width:100%;padding:12px 14px;border-radius:8px;font-size:16px;font-weight:500;color:var(--ax-text-primary);text-decoration:none;background:none;border:none;font-family:inherit;cursor:pointer;text-align:left;transition:background .12s ease}
.tb-menu-item:hover{background:var(--ax-gray-50)}
.tb-menu-item i{font-size:18px;color:var(--ax-text-tertiary);width:20px;flex-shrink:0}
.tb-menu-sep{border:none;border-top:1px solid var(--ax-border-subtle);margin:6px 6px}
/* ---- Page ---- */
.page{max-width:1180px;margin:0 auto;padding:38px 40px 60px}
.page-title{font-size:32px;font-weight:700;line-height:1.15;margin:0;letter-spacing:-.01em}
.page-sub{font-size:16px;color:var(--ax-text-tertiary);margin:8px 0 28px}
.card{background:var(--ax-surface-card);border:1px solid var(--ax-border-subtle);border-radius:14px;box-shadow:var(--ax-shadow-xs)}
/* ---- Screen 1 steps ---- */
.steps{padding:14px 36px}
.step{display:flex;gap:26px;align-items:flex-start;padding:26px 0;border-bottom:1px solid var(--ax-border-subtle)}
.step:last-child{border-bottom:none}
.step-num{flex-shrink:0;width:44px;font-size:44px;line-height:1;font-weight:700;color:var(--ax-sea-depths);text-align:center}
.step-title{font-size:20px;font-weight:700;margin:0;line-height:1.3}
.step-desc{font-size:16px;color:var(--ax-text-tertiary);margin:6px 0 0;line-height:1.45}
/* ---- Footer rows ---- */
.footer-row{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-top:26px;flex-wrap:wrap}
.foot-actions{display:flex;align-items:center;gap:14px}
.dontshow{display:inline-flex;align-items:center;gap:11px;font-size:16px;color:var(--ax-text-primary);cursor:pointer;user-select:none}
.dontshow input{position:absolute;opacity:0;width:0;height:0}
.cbox{width:20px;height:20px;border:1.5px solid var(--ax-border-strong);border-radius:5px;display:inline-flex;align-items:center;justify-content:center;background:var(--ax-surface-card);transition:background .12s ease,border-color .12s ease;flex-shrink:0}
.dontshow input:checked + .cbox{background:var(--ax-sea-depths);border-color:var(--ax-sea-depths)}
.cbox i{color:#fff;font-size:13px;opacity:0;transition:opacity .1s ease}
.dontshow input:checked + .cbox i{opacity:1}
.dontshow input:focus-visible + .cbox{box-shadow:var(--ax-focus-ring)}
/* ---- Screen 2 ---- */
.s2-card{padding:30px}
.searchbar{display:flex;gap:14px;align-items:stretch}
.searchfield{flex:1;display:flex;align-items:center;background:var(--ax-surface-card);border:1px solid var(--ax-border);border-radius:8px;padding:0 16px;box-shadow:var(--ax-shadow-xs);transition:border-color .12s ease,box-shadow .12s ease}
.searchfield:focus-within{border-color:var(--ax-aqua);box-shadow:var(--ax-focus-ring)}
.searchfield input{flex:1;border:none;outline:none;background:transparent;font-family:inherit;font-size:16px;color:var(--ax-text-primary);padding:15px 0;min-width:0}
.searchfield input::placeholder{color:var(--ax-text-placeholder)}
.section-head{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:500;color:var(--ax-text-secondary);margin:26px 0 4px}
.section-head i{font-size:17px;color:var(--ax-text-tertiary)}
.section-head.fav i{color:var(--ax-sea-depths)}
.srow{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;padding:24px 2px;border-bottom:1px solid var(--ax-border-subtle)}
.srow:last-child{border-bottom:none}
.srow-name{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.srow-name h3{font-size:22px;font-weight:600;margin:0;line-height:1.25}
.fav-badge{display:inline-flex;align-items:center;font-size:13px;font-weight:600;color:var(--ax-sea-depths);background:var(--ax-teal-50);border-radius:6px;padding:3px 10px}
.srow-meta{margin-top:14px;display:flex;flex-direction:column;gap:9px}
.meta-line{display:flex;align-items:center;gap:11px;font-size:16px;color:var(--ax-text-primary)}
.meta-line i{font-size:17px;color:var(--ax-text-tertiary);width:20px;flex-shrink:0}
.meta-link{display:inline-flex;align-items:center;gap:11px;font-size:16px;color:var(--ax-text-primary);text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.meta-link i{font-size:17px;color:var(--ax-text-tertiary);width:20px;flex-shrink:0;text-decoration:none}
.srow-actions{display:flex;align-items:center;gap:12px;flex-shrink:0}
.star-wrap{position:relative;display:inline-flex}
.starbtn{width:42px;height:42px;display:inline-flex;align-items:center;justify-content:center;background:var(--ax-surface-card);border:1px solid var(--ax-border);border-radius:8px;color:var(--ax-gray-400);font-size:19px;cursor:pointer;box-shadow:var(--ax-shadow-xs);transition:color .12s ease,border-color .12s ease,background .12s ease}
.starbtn:hover{border-color:var(--ax-border-strong)}
.starbtn.on{color:var(--ax-sea-depths)}
.starbtn:focus-visible{outline:none;box-shadow:var(--ax-focus-ring)}
.tip{position:absolute;bottom:calc(100% + 9px);left:50%;transform:translateX(-50%);background:var(--ax-midnight-blue);color:#fff;font-size:12px;font-weight:500;white-space:nowrap;padding:6px 9px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .12s ease;z-index:5}
.tip::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:var(--ax-midnight-blue)}
.star-wrap:hover .tip{opacity:1}
.unavail{flex-shrink:0;max-width:520px;display:flex;align-items:flex-start;gap:12px;background:var(--ax-teal-50);color:var(--ax-sea-depths);border-radius:10px;padding:16px 18px;font-size:16px;line-height:1.4}
.unavail i{font-size:18px;flex-shrink:0;margin-top:1px}

/* ---- Screen 3: product & service ---- */
.banner{display:flex;gap:14px;align-items:flex-start;background:var(--ax-teal-50);border-radius:12px;padding:20px 24px;margin-bottom:26px;color:var(--ax-text-primary)}
.banner > i{font-size:20px;color:var(--ax-sea-depths);flex-shrink:0;margin-top:1px}
.banner-body{font-size:16px;line-height:1.45}
.banner-link{display:inline-flex;align-items:center;gap:8px;margin-top:12px;color:var(--ax-sea-depths);font-weight:700;text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.banner-link i{font-size:15px}
.p3-card{padding:30px}
.p3-section{margin-top:26px}
.p3-section:first-child{margin-top:0}
.p3-section-title{font-size:18px;font-weight:700;margin:0 0 14px}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.rcard{border:1px solid var(--ax-border);border-radius:10px;padding:18px 20px;cursor:pointer;background:var(--ax-surface-card);transition:border-color .12s ease,box-shadow .12s ease}
.rcard:hover{border-color:var(--ax-border-strong)}
.rcard.sel{border-color:var(--ax-sea-depths);box-shadow:inset 0 0 0 1px var(--ax-sea-depths)}
.rcard-head{display:flex;align-items:flex-start;gap:14px}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--ax-border-strong);flex-shrink:0;margin-top:1px;display:inline-flex;align-items:center;justify-content:center;transition:border-color .12s ease}
.rcard.sel > .rcard-head > .radio,.radio.on{border-color:var(--ax-sea-depths)}
.radio .dot{width:9px;height:9px;border-radius:50%;background:var(--ax-sea-depths);opacity:0;transition:opacity .1s ease}
.rcard.sel > .rcard-head > .radio .dot,.radio.on .dot{opacity:1}
.rcard-title{font-size:16px;font-weight:600;color:var(--ax-text-primary);line-height:1.35}
.rcard-sub{font-size:15px;color:var(--ax-text-tertiary);margin-top:3px}
.rcard-reveal{margin-top:16px;border-top:1px solid var(--ax-border-subtle);padding-top:16px}
.flabel{display:block;font-size:15px;color:var(--ax-text-primary);margin-bottom:7px}
.req{color:var(--ax-danger-500)}
.tinput{width:100%;border:1px solid var(--ax-border);border-radius:8px;padding:12px 14px;font-family:inherit;font-size:16px;color:var(--ax-text-primary);background:var(--ax-surface-card);box-shadow:var(--ax-shadow-xs);outline:none;transition:border-color .12s ease,box-shadow .12s ease}
.tinput:hover{border-color:var(--ax-border-strong)}
.tinput:focus{border-color:var(--ax-aqua);box-shadow:var(--ax-focus-ring)}
.tinput::placeholder{color:var(--ax-text-placeholder)}
.certify{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--ax-border);border-radius:10px;padding:14px 16px;margin-top:14px;cursor:pointer;transition:border-color .12s ease,box-shadow .12s ease}
.certify.on{border-color:var(--ax-sea-depths);box-shadow:inset 0 0 0 1px var(--ax-sea-depths)}
.certify input{position:absolute;opacity:0;width:0;height:0}
.certify-txt{font-size:15px;line-height:1.45;color:var(--ax-text-primary)}
.fulfil{margin-top:16px;border:1px solid var(--ax-border);border-radius:10px;padding:4px 18px 8px}
.fulfil-title{font-size:15px;font-weight:700;padding:16px 0 6px}
.fopt{display:flex;gap:14px;align-items:flex-start;padding:16px 0;border-top:1px solid var(--ax-border-subtle);cursor:pointer}
.fopt-track{padding:4px 0 18px 34px}




.cmp{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:24px}
.plan{border:1px solid var(--ax-border);border-radius:12px;padding:22px;display:flex;flex-direction:column}
.plan.hi{border-color:var(--ax-sea-depths);box-shadow:inset 0 0 0 1px var(--ax-sea-depths)}
.plan-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.plan-name{font-size:16px;font-weight:700}
.pop{background:var(--ax-teal-50);color:var(--ax-sea-depths);font-weight:700;font-size:12px;border-radius:6px;padding:3px 10px}
.plan-price{font-size:30px;font-weight:700;margin-top:16px;line-height:1}
.plan-when{color:var(--ax-text-tertiary);font-size:14px;margin-top:6px}
.plan-btn-wrap{margin-top:18px}
.feats{margin-top:18px;display:flex;flex-direction:column;gap:14px}
.feat{display:flex;gap:11px;align-items:flex-start;font-size:14px;line-height:1.4}
.feat i{font-size:17px;flex-shrink:0;margin-top:1px}
.feat.pos i{color:var(--ax-success-600)}
.feat.neg i{color:var(--ax-gray-500)}
.feat b{font-weight:700;color:var(--ax-text-primary)}
.feat span{color:var(--ax-text-secondary)}





/* ---- Customer Information ---- */
.actionbar{display:flex;align-items:center;gap:14px;border:1px solid var(--ax-border);border-radius:10px;padding:14px 16px}
.linkbtn{background:none;border:none;font-family:inherit;font-size:15px;font-weight:600;color:var(--ax-text-tertiary);cursor:pointer;padding:8px 4px;transition:color .12s ease}
.linkbtn:hover:not(:disabled){color:var(--ax-text-primary)}
.linkbtn:disabled{color:var(--ax-text-disabled);cursor:default}
.cbanner{display:flex;align-items:flex-start;gap:12px;border-radius:10px;padding:14px 18px;font-size:15px;line-height:1.45;margin-top:18px}
.cbanner.warn{background:var(--ax-warning-50);color:var(--ax-warning-700)}
.cbanner.err{background:var(--ax-danger-50);color:var(--ax-danger-600)}
.cbanner .x{margin-left:auto;background:none;border:none;cursor:pointer;color:inherit;font-size:16px;line-height:1;padding:2px;display:inline-flex;flex-shrink:0;opacity:.7}
.cbanner .x:hover{opacity:1}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:20px 24px;margin-top:22px}
.field{display:flex;flex-direction:column;min-width:0}
.field.full{grid-column:1 / -1}
.flabel2{font-size:15px;font-weight:500;color:var(--ax-text-primary);margin-bottom:7px}
.flabel2 .opt{font-weight:400;color:var(--ax-text-tertiary);margin-left:4px}
.tselect-wrap{position:relative}
.tselect{width:100%;-webkit-appearance:none;appearance:none;border:1px solid var(--ax-border);border-radius:8px;padding:12px 40px 12px 14px;font-family:inherit;font-size:16px;color:var(--ax-text-primary);background:var(--ax-surface-card);box-shadow:var(--ax-shadow-xs);outline:none;cursor:pointer;transition:border-color .12s ease,box-shadow .12s ease}
.tselect:hover{border-color:var(--ax-border-strong)}
.tselect:focus{border-color:var(--ax-aqua);box-shadow:var(--ax-focus-ring)}
.tselect.placeholder{color:var(--ax-text-placeholder)}
.tselect-wrap > i{position:absolute;right:14px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--ax-text-tertiary);font-size:14px}
.tarea{width:100%;border:1px solid var(--ax-border);border-radius:8px;padding:13px 14px;font-family:inherit;font-size:16px;color:var(--ax-text-primary);background:var(--ax-surface-card);box-shadow:var(--ax-shadow-xs);outline:none;resize:vertical;min-height:120px;transition:border-color .12s ease,box-shadow .12s ease}
.tarea:hover{border-color:var(--ax-border-strong)}
.tarea:focus{border-color:var(--ax-aqua);box-shadow:var(--ax-focus-ring)}
.tarea::placeholder{color:var(--ax-text-placeholder)}
.fhint{font-size:14px;color:var(--ax-text-tertiary);margin-top:7px;line-height:1.4}
.tinput.err,.tarea.err{border-color:var(--ax-border-error)}
.tinput.err:focus{box-shadow:0 0 0 4px rgba(227,59,50,.18)}
.field-err{font-size:14px;color:var(--ax-text-error);margin-top:6px}
.cust-divider{border:none;border-top:1px solid var(--ax-border-subtle);margin:28px 0 0}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:26px 0 0}
.sec-head h2{font-size:20px;font-weight:700;color:var(--ax-midnight-blue);margin:0;line-height:1.25}
.sec-head h2 .opt{font-size:16px;font-weight:500;color:var(--ax-text-tertiary);margin-left:6px}
.remove-link{background:none;border:none;font-family:inherit;font-size:15px;font-weight:600;color:var(--ax-danger-600);cursor:pointer;padding:4px;transition:color .12s ease}
.remove-link:hover{color:var(--ax-danger-700)}
.addbtn{display:inline-flex;align-items:center;gap:9px;background:var(--ax-surface-card);border:1px solid var(--ax-border);border-radius:8px;padding:11px 16px;font-family:inherit;font-size:15px;font-weight:600;color:var(--ax-text-primary);cursor:pointer;box-shadow:var(--ax-shadow-xs);margin-top:22px;transition:border-color .12s ease,background .12s ease}
.addbtn:hover{border-color:var(--ax-border-strong);background:var(--ax-gray-50)}
.addbtn i{font-size:15px;color:var(--ax-text-tertiary)}
/* ---- Provide Documentation ---- */
.sect{padding:30px;margin-bottom:24px}
.sect-head h2{font-size:20px;font-weight:700;color:var(--ax-text-primary);margin:0;line-height:1.25}
.sect-head p{font-size:16px;color:var(--ax-text-tertiary);margin:7px 0 0;line-height:1.4}
.sect-body{margin-top:22px}
.rgrid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;align-items:start}
.cbanner.info{background:var(--ax-info-50);color:var(--ax-info-700)}
.cbanner.neutral{background:#F8F9FA;border:1px solid #E9ECEF;color:var(--ax-text-secondary)}
.cbanner.neutral i{color:var(--ax-text-tertiary);font-size:17px;line-height:1.35}
.cbanner .ib-title{font-weight:700;display:block;margin-bottom:2px}
.dropzone{border:1px dashed var(--ax-border-strong);border-radius:12px;padding:34px 20px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;cursor:pointer;transition:border-color .12s ease,background .12s ease}
.dropzone.drag{border-color:var(--ax-aqua);background:var(--ax-teal-50)}
.dz-icon{width:48px;height:48px;border-radius:10px;border:1px solid var(--ax-border);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--ax-text-tertiary);background:var(--ax-surface-card)}
.dz-text{font-size:16px;color:var(--ax-text-tertiary)}
.dz-text b{color:var(--ax-sea-depths);font-weight:600}
.dz-sub{font-size:14px;color:var(--ax-text-tertiary)}
.filerow{display:flex;align-items:center;gap:14px;border:1px solid var(--ax-border);border-radius:10px;padding:14px 16px;margin-top:14px}
.file-ico{width:38px;height:42px;border-radius:6px;background:var(--ax-danger-600);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;flex-shrink:0;letter-spacing:.02em}
.file-meta{min-width:0;flex:1}
.file-name{font-size:16px;font-weight:500;color:var(--ax-text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-sub{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ax-text-tertiary);margin-top:3px}
.file-sub .ok{display:inline-flex;align-items:center;gap:5px;color:var(--ax-success-600);font-weight:500}
.file-x{background:none;border:none;cursor:pointer;color:var(--ax-text-tertiary);font-size:18px;padding:4px;display:inline-flex;flex-shrink:0}
.file-x:hover{color:var(--ax-danger-600)}
.ship-card{border:1px solid var(--ax-border);border-radius:10px;margin-top:18px;overflow:hidden}
.ship-head{display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--ax-gray-50);padding:14px 18px;border-bottom:1px solid var(--ax-border-subtle)}
.ship-head h3{font-size:16px;font-weight:700;margin:0}
.ship-body{padding:18px}
/* ---- Recipients ---- */

const { useState, useEffect, useRef } = React;
const DS = window.ApostilleXpressDesignSystem_141fbe || {};
const { Button, Toast } = DS;

function ProfileMenu() {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  useEffect(() => {
    if (!open) return;
    const onDoc = (e) => {if (ref.current && !ref.current.contains(e.target)) setOpen(false);};
    const onEsc = (e) => {if (e.key === "Escape") setOpen(false);};
    document.addEventListener("mousedown", onDoc);
    document.addEventListener("keydown", onEsc);
    return () => {document.removeEventListener("mousedown", onDoc);document.removeEventListener("keydown", onEsc);};
  }, [open]);
  return (
    <div className="tb-profile-wrap" ref={ref}>
      <button className="tb-profile-btn" aria-expanded={open} aria-haspopup="menu" onClick={() => setOpen((o) => !o)}>
        <i className="bi bi-person-circle"></i>
        <span>Maria Rodriguez</span>
        <i className="bi bi-chevron-down"></i>
      </button>
      {open ?
      <div className="tb-menu" role="menu">
          <a className="tb-menu-item" role="menuitem" href="Profile.html"><i className="bi bi-person"></i>My Profile</a>
          <a className="tb-menu-item" role="menuitem" href="#faq" onClick={(e) => {e.preventDefault();setOpen(false);}}><i className="bi bi-question-circle"></i>FAQ</a>
          <hr className="tb-menu-sep" />
          <a className="tb-menu-item" role="menuitem" href="CustomerAuth.dc.html"><i className="bi bi-box-arrow-right"></i>Log Out</a>
        </div> :
      null}
    </div>);

}

function SelectStateScreen({ onCancel, onPrevious, onSelectState }) {
  const all = window.STATES_DATA || [];
  const [query, setQuery] = useState("");
  const [input, setInput] = useState("");
  const [favs, setFavs] = useState(() => { try { return JSON.parse(localStorage.getItem("ax_fav_states")) || []; } catch (e) { return []; } });
  const [toasts, setToasts] = useState([]);
  const timers = useRef({});

  useEffect(() => () => Object.values(timers.current).forEach(clearTimeout), []);
  // Favorites persist across navigation, new orders, and sessions.
  useEffect(() => { try { localStorage.setItem("ax_fav_states", JSON.stringify(favs)); } catch (e) {} }, [favs]);

  const pushToast = (t) => {
    const id = Date.now() + Math.random();
    setToasts((prev) => [...prev, { ...t, id }]);
    timers.current[id] = setTimeout(() => {
      setToasts((prev) => prev.filter((x) => x.id !== id));
      delete timers.current[id];
    }, 3200);
  };

  const toggleFav = (s) => {
    setFavs((prev) => {
      const has = prev.includes(s.id);
      if (has) {
        pushToast({ kind: "success", title: "Removed from Favorites", body: s.short + " removed from favorites." });
        return prev.filter((id) => id !== s.id);
      }
      pushToast({ kind: "success", title: "Added to Favorites", body: s.short + " added to favorites." });
      return [...prev, s.id];
    });
  };

  const q = query.trim().toLowerCase();
  const favAll = all.filter((s) => favs.includes(s.id));
  const otherAll = all.filter((s) => !favs.includes(s.id));
  const matches = q ? all.filter((s) => s.name.toLowerCase().includes(q)) : [];
  const searchResults = matches.filter((s) => !favs.includes(s.id));

  // Favorites persist across orders and sessions (localStorage). Once you have
  // favorites, the default view shows only those. Searching surfaces matching
  // states on top with favorites below. New users (no favorites) see all states.
  const sections = q ?
  [
  { key: "results", label: "Search Results", icon: "search", items: searchResults },
  { key: "favs", label: "Favorites", icon: "star", fav: true, items: favAll }] :

  favAll.length > 0 ?
  [
  { key: "favs", label: "Favorites", icon: "star", fav: true, items: favAll }] :

  [
  { key: "all", label: "All States", icon: "geo-alt", items: otherAll }];


  const visibleSections = sections.filter((sec) => sec.items.length > 0);

  return (
    <main className="page" data-screen-label="Select State to Request Certification">
      <h1 className="page-title">Select State to Request Certification</h1>
      <p className="page-sub">Select the state where the document was notarized or issued.</p>
      <div className="card s2-card">
        <div className="searchbar">
          <div className="searchfield">
            <input
              type="text"
              placeholder="Search..."
              value={input}
              onChange={(e) => {setInput(e.target.value);setQuery(e.target.value);}}
              onKeyDown={(e) => {if (e.key === "Enter") setQuery(input);}} />
            
          </div>
          <Button variant="primary" size="lg" leadingIcon={<i className="bi bi-search"></i>} onClick={() => setQuery(input)}>Search</Button>
        </div>

        {visibleSections.length === 0 ?
        <div style={{ padding: "48px 8px", textAlign: "center", color: "var(--ax-text-tertiary)" }}>
            <div style={{ fontSize: 17, fontWeight: 600, color: "var(--ax-text-primary)" }}>No states found</div>
            <div style={{ marginTop: 4, fontSize: 15 }}>Try a different search term.</div>
          </div> :

        visibleSections.map((sec) =>
        <Section key={sec.key} label={sec.label} icon={sec.icon} fav={sec.fav}>
              {sec.items.map((s) =>
          <StateRow key={s.id} s={s} isFav={favs.includes(s.id)} onToggleFav={toggleFav} onSelect={onSelectState} />
          )}
            </Section>
        )
        }
      </div>

      <div className="foot-actions" style={{ marginTop: 26 }}>
        <Button variant="tertiary" size="lg" onClick={onCancel}>Cancel</Button>
        <Button variant="secondary" size="lg" onClick={onPrevious}>Previous</Button>
      </div>

      <div className="toast-wrap bottom-right">
        {toasts.map((t) =>
        <Toast key={t.id} kind={t.kind} title={t.title} onClose={() => setToasts((p) => p.filter((x) => x.id !== t.id))}>
            {t.body}
          </Toast>
        )}
      </div>
    </main>);

}

function computeFees(form) {
  if (form.deliveryMethod === "electronic") return { stateFee: 5, stateServiceFee: 0, axFee: 69.95, intlFee: 0 };
  if (form.deliveryMethod === "traditional") {
    return { stateFee: 5, stateServiceFee: 0, axFee: 0, intlFee: form.fulfilmentType === "international" ? 10 : 0 };
  }
  return { stateFee: 0, stateServiceFee: 0, axFee: 0, intlFee: 0 };
}

// Fees for a single line item, based on THAT item's own delivery + fulfillment
// selections (stored on the item). Nothing is inherited between child orders.
function computeItemFees(it, form) {
  const dm = (it && it.deliveryMethod) || form.deliveryMethod;
  const ft = (it && it.fulfilmentType != null && it.fulfilmentType !== "") ? it.fulfilmentType : form.fulfilmentType;
  if (dm === "electronic") return { stateFee: 5, stateServiceFee: 0, axFee: 69.95, intlFee: 0 };
  if (dm === "traditional") return { stateFee: 5, stateServiceFee: 0, axFee: 0, intlFee: ft === "international" ? 10 : 0 };
  return { stateFee: 0, stateServiceFee: 0, axFee: 0, intlFee: 0 };
}

const stateCode = (st) => {
  if (!st) return "";

  if (m) return m[1];
  return (st.short || st.name || "").replace(/[^A-Za-z]/g, "").slice(0, 2).toUpperCase();
};

const DEST_COUNTRIES = ["Italy", "France", "Spain", "Germany", "Portugal", "Greece", "Netherlands", "Switzerland", "Mexico", "Brazil", "Argentina", "Japan", "South Korea", "India", "United Arab Emirates", "Australia", "New Zealand", "South Africa", "United Kingdom", "Canada"];

function TextField({ label, optional, required, value, onChange, placeholder, error, type, full }) {
  return (
    <div className={"field" + (full ? " full" : "")}>
      <label className="flabel2">
        {label}{required ? <span className="req"> *</span> : null}
        {optional ? <span className="opt">({optional})</span> : null}
      </label>
      <input
        className={"tinput" + (error ? " err" : "")}
        type={type || "text"}
        value={value}
        placeholder={placeholder}
        onChange={(e) => onChange(e.target.value)} />
      
      {error ? <div className="field-err">{error}</div> : null}
    </div>);

}

function SelectField({ label, value, onChange, placeholder, options }) {
  return (
    <div className="field">
      <label className="flabel2">{label}</label>
      <div className="tselect-wrap">
        <select className={"tselect" + (value ? "" : " placeholder")} value={value} onChange={(e) => onChange(e.target.value)}>
          <option value="">{placeholder}</option>
          {options.map((o) => <option key={o} value={o}>{o}</option>)}
        </select>
        <i className="bi bi-chevron-down"></i>
      </div>
    </div>);

}

function AddressBlock({ c, set, removable, onRemove, required, errors }) {
  const e = errors || {};
  return (
    <div>
      <div className="sec-head">
        <h2>Address Information</h2>
        {removable ? <button className="remove-link" onClick={onRemove}>Remove</button> : null}
      </div>
      <div className="fgrid">
        <TextField label="Address Line 1" required={required} error={e.addr1} value={c.addr1} onChange={(v) => set({ addr1: v })} placeholder="Enter address" />
        <TextField label="Address Line 2" value={c.addr2} onChange={(v) => set({ addr2: v })} placeholder="Enter address" />
        <SelectFieldReq label="Country" required={required} error={e.country} value={c.country} onChange={(v) => set({ country: v })} placeholder="Select country" options={COUNTRIES} />
        <SelectFieldReq label="State" required={required} error={e.state} value={c.state} onChange={(v) => set({ state: v })} placeholder="Select state" options={US_STATES} />
        <TextField label="City" required={required} error={e.city} value={c.city} onChange={(v) => set({ city: v })} placeholder="Enter city" />
        <TextField label="Zip Code" required={required} error={e.zip} value={c.zip} onChange={(v) => set({ zip: v })} placeholder="Enter zip code" />
      </div>
    </div>);

}

function CustomerInfoScreen({ form, update, onCancel, onPrevious, onContinue }) {
  const c = form.customer;
  const isTraditional = form.deliveryMethod === "traditional";
  // Traditional delivery needs a mailing address up front; electronic hides it.
  const [addressOpen, setAddressOpen] = useState(isTraditional);
  const [banner, setBanner] = useState(null); // {kind:'warn'|'err', text}
  const [errors, setErrors] = useState({});

  const set = (patch) => update((f) => ({ customer: { ...f.customer, ...patch } }));

  const isEmpty = PROFILE_FIELDS.every((k) => !c[k]) && !c.addr1 && !c.addr2 && !c.country && !c.state && !c.city && !c.zip && !c.notes;
  const profileApplied = PROFILE_FIELDS.some((k) => c[k] === USER_PROFILE[k] && USER_PROFILE[k]);

  const useProfile = () => {
    try {
      if (!USER_PROFILE) throw new Error("no profile");
      const filled = {};
      PROFILE_FIELDS.forEach((k) => {if (USER_PROFILE[k]) filled[k] = USER_PROFILE[k];});
      if (PROFILE_ADDRESS) {
        ["addr1", "addr2", "country", "state", "city", "zip"].forEach((k) => {if (PROFILE_ADDRESS[k]) filled[k] = PROFILE_ADDRESS[k];});
        setAddressOpen(true);
      }
      set(filled);
      setErrors({});
      const missing = PROFILE_FIELDS.some((k) => !USER_PROFILE[k]) || profileAddrIncomplete();
      setBanner(missing ? { kind: "warn", text: "Some fields were not pre-filled because they are not available in your profile." } : null);
    } catch (e) {
      setBanner({ kind: "err", text: "We couldn’t load your profile information. Please enter your details manually or try again." });
    }
  };

  const clearFields = () => {
    update({ customer: { firstName: "", lastName: "", phone: "", email: "", organization: "", title: "", addr1: "", addr2: "", country: "", state: "", city: "", zip: "", notes: "", reference: "" } });
    setBanner(null);
    setErrors({});
    if (!isTraditional) setAddressOpen(false);
  };

  const canContinue = c.firstName.trim() && c.lastName.trim() && c.email.trim();

  const handleContinue = () => {
    const e = {};
    if (!c.firstName.trim()) e.firstName = "First name is required.";
    if (!c.lastName.trim()) e.lastName = "Last name is required.";
    if (!c.email.trim()) e.email = "Email is required.";else
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(c.email.trim())) e.email = "Enter a valid email address.";
    setErrors(e);
    if (Object.keys(e).length === 0) onContinue();
  };

  const showAddress = isTraditional || addressOpen;

  return (
    <main className="page" data-screen-label="Customer Information">
      <h1 className="page-title">Customer Information</h1>
      <p className="page-sub">Please provide contact details for order processing and communication.</p>

      <div className="card s2-card">
        <div className="actionbar">
          <Button variant="secondary" size="md" disabled={profileApplied} onClick={useProfile}>Use My Profile Information</Button>
          <button className="linkbtn" disabled={isEmpty} onClick={clearFields}>Clear Fields</button>
        </div>

        {banner ?
        <div className={"cbanner " + banner.kind}>
            <i className={"bi " + (banner.kind === "err" ? "bi-x-circle-fill" : "bi-exclamation-triangle-fill")}></i>
            <span>{banner.text}</span>
            <button className="x" aria-label="Dismiss" onClick={() => setBanner(null)}><i className="bi bi-x-lg"></i></button>
          </div> :
        null}

        <div className="fgrid">
          <TextField label="First Name" required value={c.firstName} onChange={(v) => set({ firstName: v })} placeholder="Enter first name" error={errors.firstName} />
          <TextField label="Last Name" required value={c.lastName} onChange={(v) => set({ lastName: v })} placeholder="Enter last name" error={errors.lastName} />
          <TextField label="Phone Number" value={c.phone} onChange={(v) => set({ phone: v })} placeholder="Enter phone number" type="tel" />
          <TextField label="Email" required value={c.email} onChange={(v) => set({ email: v })} placeholder="Enter email" type="email" error={errors.email} />
          <TextField label="Organization" optional="If applicable" value={c.organization} onChange={(v) => set({ organization: v })} placeholder="Enter organization/company name" />
          <TextField label="Title" optional="If applicable" value={c.title} onChange={(v) => set({ title: v })} placeholder="Enter title" />
        </div>

        {!showAddress ?
        <button className="addbtn" onClick={() => setAddressOpen(true)}><i className="bi bi-plus-lg"></i>Add Address <span style={{ fontWeight: 400, color: "var(--ax-text-tertiary)" }}>(optional)</span></button> :
        null}

        {showAddress ?
        <React.Fragment>
            <hr className="cust-divider" />
            <AddressBlock c={c} set={set} removable={!isTraditional} onRemove={() => {setAddressOpen(false);set({ addr1: "", addr2: "", country: "", state: "", city: "", zip: "" });}} />
          </React.Fragment> :
        null}

        <hr className="cust-divider" />
        <div className="sec-head"><h2>Additional Information <span className="opt">(Optional)</span></h2></div>
        <div className="field full" style={{ marginTop: 18 }}>
          <label className="flabel2">Reference Name</label>
          <input className="tinput" maxLength={50} value={c.reference || ""} onChange={(e) => set({ reference: e.target.value.slice(0, 50) })} placeholder="Enter reference name" />
          <div className="fhint">You have {50 - (c.reference || "").length} characters remaining.</div>
        </div>
        <div className="field full" style={{ marginTop: 18 }}>
          <label className="flabel2">Notes or Special Instructions</label>
          <textarea className="tarea" value={c.notes} onChange={(e) => set({ notes: e.target.value })} placeholder="Write a note"></textarea>
        </div>
      </div>

      <div className="footer-row">
        <div className="foot-actions">
          <Button variant="tertiary" size="lg" onClick={onCancel}>Cancel</Button>
          <Button variant="secondary" size="lg" onClick={onPrevious}>Previous</Button>
        </div>
        <Button variant="primary" size="lg" disabled={!canContinue} onClick={handleContinue}>Continue</Button>
      </div>
    </main>);

}

function ReqField({ label, optional, required, value, onChange, placeholder, error }) {
  return (

        {label}{required ? <span className="req"> *</span> : null}

function ReturnAddressSection({ d, setD, customer, subtitle, errors }) {
  const a = d.returnAddr;
  const setAddr = (patch) => setD((docs) => ({ returnAddr: { ...docs.returnAddr, ...patch } }));
  const [banner, setBanner] = useState(() => {
    if (d.addrSource === "profile" && profileAddrIncomplete()) return { kind: "warn", text: "Some fields were not pre-filled because they are not available in your profile." };
    return null;
  });

  const pickSource = (src) => {
    if (src === "profile") {
      if (PROFILE_ADDRESS) {
        setD({ addrSource: src, returnAddr: { ...PROFILE_ADDRESS } });
      } else {
        setD({ addrSource: src, returnAddr: { firstName: USER_PROFILE.firstName, lastName: USER_PROFILE.lastName, addr1: "", addr2: "", country: "", state: "", city: "", zip: "" } });
      }
      setBanner(profileAddrIncomplete() ? { kind: "warn", text: "Some fields were not pre-filled because they are not available in your profile." } : null);
    } else if (src === "customer") {
      setD({ addrSource: src, returnAddr: { firstName: customer.firstName, lastName: customer.lastName, addr1: customer.addr1, addr2: customer.addr2, country: customer.country, state: customer.state, city: customer.city, zip: customer.zip } });
      setBanner(null);
    } else {
      setD({ addrSource: src, returnAddr: { firstName: "", lastName: "", addr1: "", addr2: "", country: "", state: "", city: "", zip: "" } });
      setBanner(null);
    }
  };

  return (
    <div className="card sect">
      <div className="sect-head">
        <h2>Return Address</h2>
        <p>{subtitle}</p>
      </div>
      <div className="sect-body">
        <div className="rgrid3">
          <RadioCard selected={d.addrSource === "profile"} onClick={() => pickSource("profile")} title="Profile Address" sub="Pre-filled from your profile" />
          <RadioCard selected={d.addrSource === "customer"} onClick={() => pickSource("customer")} title="Customer Address" sub="Pre-filled from customer info" />
          <RadioCard selected={d.addrSource === "new"} onClick={() => pickSource("new")} title="Add New Address" sub="Enter manually" />
        </div>

        {banner ?
        <div className={"cbanner " + banner.kind}>
            <i className={"bi " + (banner.kind === "err" ? "bi-x-circle-fill" : "bi-exclamation-triangle-fill")}></i>
            <span>{banner.text}</span>
            <button className="x" aria-label="Dismiss" onClick={() => setBanner(null)}><i className="bi bi-x-lg"></i></button>
          </div> :
        null}

        <div className="fgrid">
          <ReqField label="First Name" required value={a.firstName} onChange={(v) => setAddr({ firstName: v })} placeholder="Enter first name" error={errors.firstName} />
          <ReqField label="Last Name" required value={a.lastName} onChange={(v) => setAddr({ lastName: v })} placeholder="Enter last name" error={errors.lastName} />
          <ReqField label="Address Line 1" required value={a.addr1} onChange={(v) => setAddr({ addr1: v })} placeholder="Enter address" error={errors.addr1} />
          <ReqField label="Address Line 2" value={a.addr2} onChange={(v) => setAddr({ addr2: v })} placeholder="Enter address" />
          <SelectFieldReq label="Country" required value={a.country} onChange={(v) => setAddr({ country: v })} placeholder="Select country" options={COUNTRIES} error={errors.country} />
          <SelectFieldReq label="State" required value={a.state} onChange={(v) => setAddr({ state: v })} placeholder="Select state" options={US_STATES} error={errors.state} />
          <ReqField label="City" required value={a.city} onChange={(v) => setAddr({ city: v })} placeholder="Enter city" error={errors.city} />
          <ReqField label="Zip Code" required value={a.zip} onChange={(v) => setAddr({ zip: v })} placeholder="Enter zip code" error={errors.zip} />
        </div>

        {!d.prepaidOpen ?
        <button className="addbtn" onClick={() => setD({ prepaidOpen: true })}><i className="bi bi-plus-lg"></i>Add Prepaid Shipping Label</button> :

        <div className="ship-card">
            <div className="ship-head">
              <h3>Prepaid Shipping Label</h3>
              <button className="remove-link" onClick={() => setD({ prepaidOpen: false, shippingTracking: "" })}>Remove</button>
            </div>
            <div className="ship-body">
              <label className="flabel2">Tracking number <span className="opt">(optional)</span></label>
              <input className="tinput" value={d.shippingTracking} onChange={(e) => setD({ shippingTracking: e.target.value })} placeholder="e.g. 1Z999AA10123456784" />
            </div>
          </div>
        }
      </div>
    </div>);

}

            <label className="flabel2">Name on Document or Entity <span className="opt">(optional)</span></label>

          </div>

          <SelectFieldReq label="Document Description" required value={d.docDesc} onChange={(v) => setD({ docDesc: v })} placeholder={d.docType ? "Select description" : "Select document type first"} options={descOptions} error={errors.docDesc} />

      <div className="sect-head">

function fmtSize(bytes) {
  if (bytes >= 1048576) return (bytes / 1048576).toFixed(1) + " MB";
  if (bytes >= 1024) return Math.round(bytes / 1024) + " KB";
  return bytes + " B";
}

function UploadSection({ d, setD }) {
  const inputRef = useRef(null);
  const [drag, setDrag] = useState(false);

  const addFiles = (fileList) => {
    const added = Array.from(fileList).map((f) => ({ id: Date.now() + "-" + f.name + Math.random(), name: f.name, size: f.size, pct: 100 }));
    setD((docs) => ({ files: [...docs.files, ...added] }));
  };

  return (
    <div className="card sect">
      <div className="sect-head"><h2>Upload Document <span className="req">*</span></h2></div>
      <div className="sect-body">
        <div
          className={"dropzone" + (drag ? " drag" : "")}
          onClick={() => inputRef.current && inputRef.current.click()}
          onDragOver={(e) => {e.preventDefault();setDrag(true);}}
          onDragLeave={() => setDrag(false)}
          onDrop={(e) => {e.preventDefault();setDrag(false);if (e.dataTransfer.files.length) addFiles(e.dataTransfer.files);}}>
          
          <div className="dz-icon"><i className="bi bi-cloud-arrow-up"></i></div>
          <div className="dz-text"><b>Click to upload</b> or drag and drop</div>
          <div className="dz-sub">PDF, JPEG, TIFF (Files cannot exceed 10MB)</div>
          <input ref={inputRef} type="file" accept=".pdf,.jpg,.jpeg,.tiff,.tif" multiple style={{ display: "none" }} onChange={(e) => {if (e.target.files.length) addFiles(e.target.files);e.target.value = "";}} />
        </div>
        {d.files.map((f) =>
        <div className="filerow" key={f.id}>
            <div className="file-ico">PDF</div>
            <div className="file-meta">
              <div className="file-name">{f.name}</div>
              <div className="file-sub">{fmtSize(f.size)}<span>|</span><span className="ok"><i className="bi bi-check-circle"></i>{f.pct}%</span></div>
            </div>
            <button className="file-x" aria-label="Remove file" onClick={() => setD((docs) => ({ files: docs.files.filter((x) => x.id !== f.id) }))}><i className="bi bi-x-lg"></i></button>
          </div>
        )}
      </div>
    </div>);

}

const pageCount = (f) => f ? Math.min(5, Math.max(1, Math.ceil((f.size || 0) / 900000))) : 1;

function DocSheet({ file, page, total }) {
  return (
    <div className="doc-sheet">
      <img className="doc-img" src="assets/sample-certificate.png" alt={(file && file.name ? file.name : "Document") + " — page " + page} draggable="false" />
      <div className="doc-page-no">Page {page} of {total}</div>
    </div>);

}

function PreviewModal({ files, onClose, onConfirm }) {
  const ZOOMS = [50, 75, 100, 125, 150, 200];
  const [sel, setSel] = useState(0);
  const [page, setPage] = useState(1);
  const [zi, setZi] = useState(2);
  const [rot, setRot] = useState(0);
  const file = files[sel] || files[0];
  const total = pageCount(file);
  useEffect(() => {setPage(1);setRot(0);}, [sel]);
  useEffect(() => {
    const onEsc = (e) => {if (e.key === "Escape") onClose();};
    document.addEventListener("keydown", onEsc);
    return () => document.removeEventListener("keydown", onEsc);
  }, []);
  const zoom = ZOOMS[zi];
  const totalPages = files.reduce((s, f) => s + pageCount(f), 0);
  return (
    <div className="scrim" onClick={onClose}>
      <div className="modal full pv-modal" onClick={(e) => e.stopPropagation()} role="dialog" aria-label="Document preview">
        <div className="pv-head">
          <div>
            <h2>Document Preview</h2>
            <p>Review your uploaded documents. Ensure each page is clear and legible — blurry or low-quality scans will delay processing.</p>
          </div>
          <button className="modal-x" aria-label="Close" onClick={onClose}><i className="bi bi-x-lg"></i></button>
        </div>
        <div className="pv-body">
          <aside className="pv-side">
            <div className="pv-side-head">Uploaded Files ({files.length})</div>
            <div className="pv-files">
              {files.map((f, i) =>
              <button key={f.id} className={"pv-file" + (i === sel ? " sel" : "")} onClick={() => setSel(i)}>
                  <span className="pfi">PDF</span>
                  <span className="pfm">
                    <span className="pfn">{f.name}</span>
                    <span className="pfs">{fmtSize(f.size)} · {pageCount(f)} page{pageCount(f) === 1 ? "" : "s"}</span>
                  </span>
                </button>
              )}
            </div>
          </aside>
          <section className="pv-view">
            <div className="pv-toolbar">
              <div className="pv-tname">
                <span style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{file ? file.name : ""}</span>
                <span className="tag">{file ? fmtSize(file.size) : ""}</span>
              </div>
              <div className="pv-tools">
                <div className="pv-group">
                  <button className="pv-ic" aria-label="Previous page" disabled={page <= 1} onClick={() => setPage((p) => Math.max(1, p - 1))}><i className="bi bi-chevron-left"></i></button>
                  <span className="pv-readout">{page} / {total}</span>
                  <button className="pv-ic" aria-label="Next page" disabled={page >= total} onClick={() => setPage((p) => Math.min(total, p + 1))}><i className="bi bi-chevron-right"></i></button>
                </div>
                <div className="pv-group">
                  <button className="pv-ic" aria-label="Zoom out" disabled={zi <= 0} onClick={() => setZi((z) => Math.max(0, z - 1))}><i className="bi bi-zoom-out"></i></button>
                  <span className="pv-readout">{zoom}%</span>
                  <button className="pv-ic" aria-label="Zoom in" disabled={zi >= ZOOMS.length - 1} onClick={() => setZi((z) => Math.min(ZOOMS.length - 1, z + 1))}><i className="bi bi-zoom-in"></i></button>
                </div>
                <select className="pv-fit" value={String(zoom)} onChange={(e) => setZi(ZOOMS.indexOf(Number(e.target.value)))} aria-label="Zoom level">
                  {ZOOMS.map((z) => <option key={z} value={String(z)}>{z}%</option>)}
                </select>
                <div className="pv-group">
                  <button className="pv-ic" aria-label="Rotate page" onClick={() => setRot((r) => (r + 90) % 360)}><i className="bi bi-arrow-clockwise"></i></button>
                  <button className="pv-ic" aria-label="Download" onClick={(e) => e.preventDefault()}><i className="bi bi-download"></i></button>
                </div>
              </div>
            </div>
            <div className="pv-stage">
              <div className="pv-scaler" style={{ transform: "scale(" + zoom / 100 + ") rotate(" + rot + "deg)" }}>
                <DocSheet file={file} page={page} total={total} />
              </div>
            </div>
          </section>
        </div>
        <div className="pv-foot">
          <div className="pv-foot-note"><i className="bi bi-info-circle"></i><span>{files.length} file{files.length === 1 ? "" : "s"} · {totalPages} pages total</span></div>
          <div className="pv-foot-actions">

    if (addrEmpty && d.addrSource === "profile" && PROFILE_ADDRESS) patch.returnAddr = { ...PROFILE_ADDRESS };
    if (Object.keys(patch).length) setD(patch);
  }, []);

  // Version A = electronic + upload (file flow). Otherwise an address flow.
  const isUploadFlow = isElectronic && d.provideMethod === "upload";
  const isPickup = !isElectronic && form.fulfilmentType === "pickup";
  const needsAddress = (!isElectronic && !isPickup) || (isElectronic && d.provideMethod === "mail");

  const docInfoValid = d.docType && d.docDesc && d.destCountry;

function docNo(seed) {
  let h = 0;const s = String(seed);
  for (let i = 0; i < s.length; i++) h = h * 31 + s.charCodeAt(i) >>> 0;
  return ("000000000" + h % 1000000000).slice(-9) + "-01";
}

function deriveLineItems(form) {
  const d = form.docs;
  const isElectronic = form.deliveryMethod === "electronic";
  const isUpload = isElectronic && d.provideMethod === "upload";
  const mk = (id, name) => ({ id, name: String(name).replace(/\.[^.]+$/, ""), docId: docNo(id), fulfilmentType: form.fulfilmentType || "", trackingNumber: form.trackingNumber || "", deliveryMethod: form.deliveryMethod || "" });
  if (isUpload && d.files.length) return d.files.map((f) => mk(f.id, f.name));
  return [mk("doc0", d.docDesc || d.docType || "Apostille document")];
}

}

function PaymentScreen({ form, update, goTo, onCancel, onPrevious, onSubmit }) {
  const isElectronic = form.deliveryMethod === "electronic";
  const fees = computeFees(form);
  const c = form.customer;
  const code = stateCode(form.state);
  const deliveryShort = isElectronic ? "Electronic" : "Traditional";

  // Line items accumulate across passes through the flow. When the user chose
  // "Add New Apostille" (which routes back to Select State), the freshly-built
  // document is appended to the apostilles already in the order, up to 35 total.
  const [items, setItems] = useState(() => {
    const base = (form.apostilles && form.apostilles.length) ? form.apostilles : [];
    if (form.pendingApostille) {
      const added = deriveLineItems(form).map((li) => ({ ...li, id: li.id + "-" + Math.random().toString(36).slice(2, 7) }));
      return [...base, ...added].slice(0, 35);
    }
    return base.length ? base : deriveLineItems(form);
  });
  useEffect(() => { if (form.pendingApostille) update({ pendingApostille: false }); }, []);
  useEffect(() => {update({ apostilles: items });}, [items]);

  const sig = form.signatures || { unique: 0, repeated: 0 };
  const setSig = (patch) => update((f) => ({ signatures: { ...(f.signatures || { unique: 0, repeated: 0 }), ...patch } }));

  const pay = form.payment;
  const setPay = (patch) => update((f) => ({ payment: { ...f.payment, ...patch } }));

  const count = items.length;
  const perItemFees = items.map((it) => computeItemFees(it, form));
  const sumFee = (k) => perItemFees.reduce((s, f) => s + f[k], 0);
  const stateTotal = sumFee("stateFee");
  const serviceTotal = sumFee("stateServiceFee");
  const axTotal = sumFee("axFee");
  const intlTotal = sumFee("intlFee");
  const grand = stateTotal + serviceTotal + axTotal + intlTotal;
  const totalSig = sig.unique + sig.repeated;
  const sigOver = totalSig > count;

  const [touched, setTouched] = useState(false);
  const cardValid = pay.method !== "card" || pay.cardNumber.trim() && pay.exp.trim() && pay.cvc.trim() && pay.cardName.trim() && pay.zip.trim();

  const addItem = () => setItems((arr) => [...arr, { id: "a" + Date.now(), name: arr[0] && arr[0].name || "Additional Document", docId: docNo("a" + Date.now()) }]);
  const delItem = (id) => setItems((arr) => arr.length <= 1 ? arr : arr.filter((it) => it.id !== id));

  const submit = () => {
    setTouched(true);
    if (!cardValid) return;
    if (sigOver) return;
    const num = String(Date.now());
    const dt = new Date();
    const pad = (n) => String(n).padStart(2, "0");
    const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    const placed = MON[dt.getMonth()] + " " + pad(dt.getDate()) + ", " + dt.getFullYear();
    // Build one child apostille per line item so the Documents count is always
    // children.length — the same array the Order Overview renders.
    const isAdoption = form.apostilleRequest === "adoption";
    const provideMail = isElectronic && form.docs.provideMethod === "mail";
    const flow = isElectronic ? (provideMail ? "paper-to-digital" : "digital-upload") : "paper-to-paper";
    const isPickup = !isElectronic && form.fulfilmentType === "pickup";
    const needsReturn = (!isElectronic && !isPickup) || provideMail;
    const productLabel = isElectronic ? "Digital" : "Paper";
    const stateShort = (form.state && form.state.short) ? form.state.short : "Delmarva";
    const stateFull = (form.state && form.state.name) ? form.state.name : "Delmarva Secretary of State";
    const stateCd = stateCode(form.state) || "DM";
    const svcLabel = form.serviceType === "sameday" ? "Same-Day" : (form.serviceType === "express" ? "Express" : "Standard");
    const dd = form.docs || {};
    const docName = (dd.nameOnDoc && dd.nameOnDoc.trim()) ? dd.nameOnDoc.trim() : "";
    // Customer address the user entered (blank when none — the child hides it).
    const cust = form.customer || {};
    const custCityStateZip = [cust.city, [cust.state, cust.zip].filter(Boolean).join(" ").trim()].filter(Boolean).join(", ");
    const custAddress = { line1: cust.addr1 || "", line2: cust.addr2 || "", cityStateZip: custCityStateZip, country: cust.country || "" };
    // Return address, composed from whichever source the user chose in the docs step.
    const ra = dd.returnAddr || {};
    const returnCityStateZip = [ra.city, [ra.state, ra.zip].filter(Boolean).join(" ").trim()].filter(Boolean).join(", ");
    const returnAddressForOrder = needsReturn ? {
      name: [ra.firstName, ra.lastName].filter(Boolean).join(" ").trim(),

      cityStateZip: returnCityStateZip,

    const FULFIL_LABELS = { usps: "Mailed via USPS (no tracking)", "prepaid-label": "Pre-paid Shipping Label", "prepaid-envelope": "Pre-paid Envelope", international: "International Shipping", pickup: "Pick-Up in Person" };
    // Map the recipient(s) the user actually entered onto every child apostille,

    const digitalRecipientsForOrder = (form.recipients || [])
      .filter((r) => r && (r.firstName || r.lastName || r.email))

      email: m.email || "",
      phone: m.phone || "",
      addrLine1: [m.addr1, m.addr2].filter(Boolean).join(", "),
      addrCityState: [m.city, m.state, m.country].filter(Boolean).join(", "),
      sentTo: dd.destCountry || "",
      tracking: form.trackingNumber || ""
    };
    const children = items.map((it, i) => {
      const cn = stateCd + "-" + num + "_" + ("0000" + (i + 1)).slice(-4);
      const ch = (window.AXOrders && window.AXOrders.makeChildOrder)
        ? window.AXOrders.makeChildOrder(cn, flow, "New", { placedOn: placed, serviceType: svcLabel, ref: (cust.reference && cust.reference.trim()) || it.docId || ("RO" + num.slice(0, 3)), productLabel })
        : { number: cn, status: "New", deliveryFlow: flow, productLabel, serviceType: svcLabel, placedOn: placed, requestType: isElectronic ? "Digital" : "Paper", issuingState: stateFull, issuingStateShort: stateShort, referenceName: (cust.reference && cust.reference.trim()) || it.docId || ("RO" + num.slice(0, 3)), recipients: [], document: {} };
      ch.issuingState = stateFull;
      ch.issuingStateShort = stateShort;
      ch.issuingStateCode = stateCd;
      // Fulfillment type is stored per line item, so each child order keeps its own.
      const fType = it.fulfilmentType || form.fulfilmentType || "";
      const fTrack = (it.trackingNumber != null && it.trackingNumber !== "") ? it.trackingNumber : (form.trackingNumber || "");
      ch.shippingMethod = !isElectronic ? (FULFIL_LABELS[fType] || "") : "";
      if (ch.document) {
        ch.document = {
          ...ch.document,
          name: docName || it.name || ch.document.name,
          type: dd.docType || ch.document.type,
          description: dd.docDesc || ch.document.description,
          adoptionAgency: isAdoption ? (form.adoptionAgency || "") : "",
          issuingState: stateShort,
          destCountry: dd.destCountry || ch.document.destCountry || "",
          productLabel
        };
      }
      if (ch.customer) {
        ch.customer = {
          ...ch.customer,
          firstName: c.firstName || ch.customer.firstName,
          lastName: c.lastName || ch.customer.lastName,
          email: c.email || ch.customer.email,
          phone: c.phone || "",
          title: c.title || "",
          company: c.organization || "",
          notes: c.notes != null ? c.notes : "",
          address: custAddress,
        };
      }
      ch.returnAddress = returnAddressForOrder;
      if (isElectronic) {
        if (digitalRecipientsForOrder.length) ch.recipients = JSON.parse(JSON.stringify(digitalRecipientsForOrder));
      } else if (isPickup) {
        ch.pickup = true;
        ch.recipients = [];
        ch.paperRecipient = null;
      } else {
        ch.paperRecipient = { ...(ch.paperRecipient || {}), ...paperRecipientForOrder, tracking: fTrack };
      }
      return ch;
    });
    const last4 = (pay.cardNumber || "4242").replace(/\D/g, "").slice(-4) || "4242";
    const parentOrder = { number: num, placedOn: placed, payment: { brand: pay.method === "card" ? "Visa" : "Card", last4 }, children };
    try {
      const arr = JSON.parse(localStorage.getItem("ax_orders") || "[]");
      // Drop any legacy summary rows (no children) so the list stays consistent.
      const cleaned = (Array.isArray(arr) ? arr : []).filter((o) => o && Array.isArray(o.children));
      cleaned.unshift(parentOrder);
      localStorage.setItem("ax_orders", JSON.stringify(cleaned));
      localStorage.setItem("ax_active_order", JSON.stringify(parentOrder));
    } catch (e) {}
    update({ orderNumber: num, total: grand });
    onSubmit();
  };

  const METHODS = [
  { id: "card", label: "Card", icon: "bi-credit-card" },
  { id: "applepay", label: "ApplePay", icon: "bi-apple" },
  { id: "paypal", label: "PayPal", icon: "bi-paypal" }];

  const CC_BRANDS = ["VISA", "MC", "AMEX", "DISC"];

  return (
    <main className="page" data-screen-label="Billing and Payment">
      <h1 className="page-title">Billing and Payment</h1>
      <p className="page-sub">Securely complete your payment by reviewing your order and providing billing details.</p>

      <div className="pay-cols">
        <div>
          <div className="card sect">
            <div className="sum-head">
              <div>
                <div className="sum-title"><h2>Order Summary</h2><span className="sum-badge green">{count} Apostille{count === 1 ? "" : "s"}</span></div>
                <p className="sum-sub">Review the details of your order</p>
              </div>
              <Button variant="secondary" size="md" disabled={count >= 35} onClick={() => { if (count >= 35) { return; } update({ pendingApostille: true }); goTo("select"); }}><i className="bi bi-plus-lg" style={{ marginRight: 8 }}></i>Add New Apostille</Button>
            </div>

            <div style={{ overflowX: "auto" }}>
              <table className="otable paytable">
                <thead>
                  <tr>
                    <th>Description</th><th>State Fee</th><th>State Service Fee</th><th>AX Fee</th><th>International&nbsp;Fee</th><th aria-label="Actions"></th>
                  </tr>
                </thead>
                <tbody>
                  {items.map((it) => {
                    const rf = computeItemFees(it, form);
                    return (
                    <tr key={it.id}>
                      <td>{it.name}<div className="sub">{it.docId}</div></td>
                      <td>{fmtMoney(rf.stateFee)}<div className="sub">{code || "—"}</div></td>
                      <td>{fmtMoney(rf.stateServiceFee)}<div className="sub">Standard</div></td>
                      <td>{fmtMoney(rf.axFee)}<div className="sub">{deliveryShort}</div></td>
                      <td>{fmtMoney(rf.intlFee)}</td>
                      <td>
                        <div className="row-acts">
                          <button className="icon-btn del" aria-label="Remove apostille" disabled={items.length <= 1} onClick={() => delItem(it.id)}><i className="bi bi-trash"></i></button>
                          <button className="icon-btn" aria-label="Edit document" onClick={() => goTo("docs")}><i className="bi bi-pencil-square"></i></button>
                        </div>
                      </td>
                    </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>

          <div className="card sect">
            <div className="cbanner info" style={{ marginTop: 0, marginBottom: 24, padding: "18px 22px" }}>
              <i className="bi bi-info-circle-fill"></i>
              <span><b>Why we ask this:</b> The Legislature requires us to track and report the number of unique notary signatures on documents we process. This does not affect your pricing — it helps us stay compliant with state reporting requirements.</span>
            </div>
            <div className="sig-head-row"><span>Signature type</span><span>Quantity</span></div>
            <div className="sig-row">
              <div className="sig-body">
                <div className="sig-name">Unique Signatures</div>
                <div className="sig-desc">Count each individual signer once (Notary/Public Official), regardless of how many times they signed.</div>
                <div className="sig-applies">Applies to all submitted documents.</div>
              </div>
              <Stepper value={sig.unique} min={0} max={Math.max(0, count - sig.repeated)} onChange={(v) => setSig({ unique: v })} />
            </div>
            <div className="sig-row">
              <div className="sig-body">
                <div className="sig-name">Repeated Signatures</div>
                <div className="sig-desc">The number of times a signer appears after their first appearance.</div>
                <div className="sig-applies">Applies to all submitted documents.</div>
              </div>
              <Stepper value={sig.repeated} min={0} max={Math.max(0, count - sig.unique)} onChange={(v) => setSig({ repeated: v })} />
            </div>
            <div className="sig-row">
              <div className="sig-body">
                <div className="sig-name">Total signatures captured</div>
                <div className="sig-desc">For state reporting purposes only — does not affect order pricing. Must not exceed the number of Apostilles requested.</div>
                {sigOver ? <div className="field-err" style={{ marginTop: 6 }}>Total signatures ({totalSig}) can’t exceed the {count} apostille{count === 1 ? "" : "s"} in this order. Remove {totalSig - count} to continue.</div> : null}
              </div>
              <div className="sig-total" style={sigOver ? { borderColor: "var(--ax-border-error)", color: "var(--ax-danger-600)" } : null}>{totalSig}</div>
            </div>
          </div>

          <div className="card sect">
            <div className="feesum">
              <div className="feerow"><span className="lbl">State Fee</span><span>{fmtMoney(stateTotal)}</span></div>
              <div className="feerow"><span className="lbl">State Service Fee</span><span>{fmtMoney(serviceTotal)}</span></div>
              <div className="feerow"><span className="lbl">International Fee</span><span>{fmtMoney(intlTotal)}</span></div>
              <div className="feerow"><span className="lbl">AX Fee</span><span>{fmtMoney(axTotal)}</span></div>
              <hr className="fee-divider" />
              <div className="feerow total"><span>Total</span><span>{fmtMoney(grand)}</span></div>
            </div>
          </div>
        </div>

        <div>
          <div className="card sect pay-method">
            <div className="sect-head"><h2>Payment Method</h2></div>
            <div className="pay-tabs">
              {METHODS.map((mth) =>
              <button key={mth.id} type="button" className={"pay-tab" + (pay.method === mth.id ? " sel" : "")} onClick={() => setPay({ method: mth.id })}>
                  <i className={"bi " + mth.icon}></i>{mth.label}
                </button>
              )}
            </div>

            {pay.method === "card" ?
            <React.Fragment>
                <label className="pm-label">Card Information</label>
                <div className="card-field-group">
                  <div className="cfg-row">
                    <input className="cfg-input" inputMode="numeric" placeholder="1234 1234 1234 1234" value={pay.cardNumber} onChange={(e) => setPay({ cardNumber: e.target.value })} />
                    <div className="cfg-icons">{CC_BRANDS.map((b) => <span className="cc" key={b}>{b}</span>)}</div>
                  </div>
                  <div className="cfg-row">
                    <div className="half"><input className="cfg-input" placeholder="MM / YY" value={pay.exp} onChange={(e) => setPay({ exp: e.target.value })} /></div>
                    <div className="half cvc-half">
                      <input className="cfg-input" inputMode="numeric" placeholder="CVC" value={pay.cvc} onChange={(e) => setPay({ cvc: e.target.value })} />
                      <i className="bi bi-credit-card-2-front"></i>
                    </div>
                  </div>
                </div>

                <label className="pm-label">Cardholder Name</label>
                <input className="tinput" placeholder="Full name on card" value={pay.cardName} onChange={(e) => setPay({ cardName: e.target.value })} />

                <label className="pm-label">Country or Region</label>
                <div className="card-field-group">
                  <div className="cfg-row">
                    <select className="cfg-input cfg-select" value={pay.country} onChange={(e) => setPay({ country: e.target.value })}>
                      {COUNTRIES.map((o) => <option key={o} value={o}>{o}</option>)}
                    </select>
                    <i className="bi bi-chevron-down cfg-chev"></i>
                  </div>
                  <div className="cfg-row"><input className="cfg-input" inputMode="numeric" placeholder="ZIP" value={pay.zip} onChange={(e) => setPay({ zip: e.target.value })} /></div>
                </div>
              </React.Fragment> :

            <div className="cbanner info" style={{ marginTop: 18 }}>
                <i className="bi bi-info-circle-fill"></i>
                <span>You'll be redirected to {pay.method === "applepay" ? "Apple Pay" : "PayPal"} to authorize this payment after you click Pay.</span>
              </div>
            }

            {touched && !cardValid ? <div className="field-err" style={{ marginTop: 12 }}>Please complete all card fields.</div> : null}
            {sigOver ? <div className="field-err" style={{ marginTop: 12 }}>Reduce the signature count — it can’t exceed the {count} apostille{count === 1 ? "" : "s"} in this order.</div> : null}

            <div className="pay-btn-group">
              <Button variant="primary" size="lg" disabled={sigOver} onClick={submit}>Pay</Button>
              <Button variant="secondary" size="lg" onClick={onCancel}>Cancel</Button>
            </div>
            <p className="fineprint">By clicking Pay, you agree to the <a href="#terms" onClick={(e) => e.preventDefault()}>Terms</a> and <a href="#privacy" onClick={(e) => e.preventDefault()}>Privacy Policy</a>.</p>
          </div>
        </div>
      </div>

      <div className="footer-row">
        <div className="foot-actions">
          <Button variant="tertiary" size="lg" onClick={onCancel}>Cancel</Button>
          <Button variant="secondary" size="lg" onClick={onPrevious}>Previous</Button>
        </div>
      </div>
    </main>);

}

// ---- Step 6: Order Confirmed ------------------------------------------
function ConfirmationScreen({ form, onDone }) {
  const isElectronic = form.deliveryMethod === "electronic";
  const items = form.apostilles || [];
  const c = form.customer;
  const st = form.state;
  const fees = computeFees(form);
  const code = stateCode(st);
  const deliveryShort = isElectronic ? "Electronic" : "Traditional";
  const count = items.length;
  const perItemFees = items.map((it) => computeItemFees(it, form));
  const sumFee = (k) => perItemFees.reduce((s, f) => s + f[k], 0);
  const stateTotal = sumFee("stateFee");
  const serviceTotal = sumFee("stateServiceFee");
  const axTotal = sumFee("axFee");
  const intlTotal = sumFee("intlFee");
  const grand = form.total != null ? form.total : stateTotal + serviceTotal + axTotal + intlTotal;

  const email = c.email || ((form.recipients || [])[0] || {}).email || USER_PROFILE.email;
  const phone = c.phone || form.mailing.phone || "";
  const pay = form.payment;
  const last4 = (pay.cardNumber || "").replace(/\D/g, "").slice(-4) || "9849";
  const payTypeLabel = pay.method === "card" ? "Credit Card (CC)" : pay.method === "applepay" ? "Apple Pay" : "PayPal";
  const custAddr = [c.addr1, c.addr2, [c.city, c.state, c.zip].filter(Boolean).join(", "), c.country].filter(Boolean);

  return (
    <main className="page" data-screen-label="Order Confirmed">
      <div className="conf-head">
        <div>
          <h1 className="page-title">Order Confirmed!</h1>
          <p className="page-sub" style={{ margin: "8px 0 0" }}>An order confirmation has been sent to {email}</p>
        </div>
        <div className="conf-actions">
          <Button variant="secondary" size="lg" onClick={onDone}><i className="bi bi-arrow-left" style={{ marginRight: 8 }}></i>Back to Orders</Button>
          <Button variant="primary" size="lg" onClick={() => window.print()}><i className="bi bi-download" style={{ marginRight: 8 }}></i>Download Receipt</Button>
        </div>
      </div>

      <div className="banner-success"><span>Order <b>#{form.orderNumber}</b> has been successfully placed.</span></div>

      <div className="auth-banner">
        <i className="bi bi-envelope"></i>
        <span>{isElectronic ?
          "Your documents are with the Issuing Authority for review. Recipients will be emailed once the e-Apostille is issued." :
          <React.Fragment>Send your documents to the Issuing Authority. Please see the <a href="#delivery" onClick={(e) => e.preventDefault()}>delivery form</a> for more information.</React.Fragment>}
        </span>
      </div>
      <div className="auth-card">
        <div className="auth-col">
          <div className="lbl">Address</div>
          <div className="val">{st ? st.name : "Issuing Authority"}<br />{st && st.address ? st.address : "—"}<br />United States</div>
        </div>
        <div className="auth-col" style={{ textAlign: "right" }}>
          <div className="lbl">Business Hours</div>
          <div className="val">Mon–Fri: 8:00 AM – 5:00 PM PT</div>
          <div className="lbl" style={{ marginTop: 12 }}>Phone</div>
          <div className="val">{st && st.phone ? st.phone : "—"}</div>
        </div>
      </div>

      <div className="conf-cols">
        <div className="od-card" style={{ backgroundColor: "rgb(255, 255, 255)" }}>
          <div className="od-head">Order Details</div>
          <div className="od-body">
            <div className="od-block">
              <div className="lbl">Customer Information</div>
              <div className="txt">
                {(c.firstName + " " + c.lastName).trim() || "—"}
                {custAddr.map((l, i) => <div key={i}>{l}</div>)}
              </div>
            </div>
            <div className="od-block">
              <div className="lbl">Payment Method</div>
              <div className="pm">
                {pay.method === "card" ?
                <React.Fragment><span className="cc">VISA</span>ending with {last4}</React.Fragment> :
                <React.Fragment><i className={"bi " + (pay.method === "applepay" ? "bi-apple" : "bi-paypal")} style={{ fontSize: 18 }}></i>{payTypeLabel}</React.Fragment>}
              </div>
            </div>
            <div className="od-block">
              <div className="lbl">Payment Type</div>
              <div className="txt">{payTypeLabel}</div>
            </div>
            <div className="od-block">
              <div className="lbl">Contact Information</div>
              <div className="txt">{email}{phone ? <div>{phone}</div> : null}</div>
            </div>
          </div>
        </div>

        <div>
          <div className="card" style={{ overflowX: "auto", marginBottom: 24 }}>
            <table className="otable paytable">
              <thead>
                <tr><th>Description</th><th>State Fee</th><th>State Service Fee</th><th>AX Fee</th><th>International&nbsp;Fee</th><th>Delivery Form</th></tr>
              </thead>
              <tbody>
                {items.map((it) => {
                  const rf = computeItemFees(it, form);
                  return (
                <tr key={it.id}>
                    <td>{it.name}<div className="sub">{it.docId}</div></td>
                    <td>{fmtMoney(rf.stateFee)}<div className="sub">{code || "—"}</div></td>
                    <td>{fmtMoney(rf.stateServiceFee)}<div className="sub">Standard</div></td>
                    <td>{fmtMoney(rf.axFee)}<div className="sub">{deliveryShort}</div></td>
                    <td>{fmtMoney(rf.intlFee)}</td>
                    <td><button className="pdf-btn" aria-label="Download delivery form" onClick={() => window.print()}>PDF</button></td>
                  </tr>
                  );
                })}
              </tbody>
            </table>
          </div>

          <div className="card sect">
            <div className="feesum">
              <div className="feerow"><span className="lbl">State Fee</span><span>{fmtMoney(stateTotal)}</span></div>
              <div className="feerow"><span className="lbl">State Service Fee</span><span>{fmtMoney(serviceTotal)}</span></div>
              {intlTotal > 0 ? <div className="feerow"><span className="lbl">International Fee</span><span>{fmtMoney(intlTotal)}</span></div> : null}
              <div className="feerow"><span className="lbl">AX Fee</span><span>{fmtMoney(axTotal)}</span></div>
              <hr className="fee-divider" />
              <div className="feerow total"><span>Total</span><span>{fmtMoney(grand)}</span></div>
            </div>
          </div>
        </div>
      </div>
    </main>);

}

function App() {
  const [screen, setScreen] = useState("intro");
  const [form, setForm] = useState(DEFAULT_FORM);
  const [showCancel, setShowCancel] = useState(false);

  // Shared order form — persisted so later steps (e.g. payment) can read it.
  const fees = computeFees(form);
  const isPickupOrder = form.deliveryMethod !== "electronic" && form.fulfilmentType === "pickup";
  useEffect(() => {
    try {localStorage.setItem("ax_order_form", JSON.stringify({ ...form, fees }));} catch (e) {}
  }, [form]);

  // Accepts an object patch OR a functional patch (prev => patch); functional
  // form is required when merging nested objects so rapid same-tick updates
  // (e.g. typing a field then toggling a section) compose instead of clobber.
  const update = (patch) => setForm((f) => ({ ...f, ...(typeof patch === "function" ? patch(f) : patch) }));
  const requestCancel = () => setShowCancel(true);
  const goOrders = () => {window.location.href = "Orders.dc.html";};

  return (
    <div>
      <TopBar />
      {screen === "intro" ?
      <IntroScreen onStart={() => setScreen("select")} onCancel={requestCancel} /> :
      screen === "select" ?
      <SelectStateScreen
        onCancel={requestCancel}
        onPrevious={() => setScreen("intro")}
        onSelectState={(s) => {update({ state: { id: s.id, name: s.name, short: s.short, address: s.address, phone: s.phone } });setScreen("product");}} /> :

      screen === "product" ?
      <ChooseProductScreen
        form={form}
        update={update}
        onCancel={requestCancel}
        onPrevious={() => setScreen("select")}
        onContinue={() => setScreen("customer")} /> :

      screen === "customer" ?
      <CustomerInfoScreen
        form={form}
        update={update}
        onCancel={requestCancel}
        onPrevious={() => setScreen("product")}
        onContinue={() => setScreen("docs")} /> :

      screen === "docs" ?
      <ProvideDocumentationScreen
        form={form}
        update={update}
        onCancel={requestCancel}
        onPrevious={() => setScreen("customer")}
        onContinue={() => setScreen(isPickupOrder ? "payment" : "recipients")} /> :

      screen === "recipients" ?
      <RecipientsScreen
        form={form}
        update={update}
        onCancel={requestCancel}
        onPrevious={() => setScreen("docs")}
        onContinue={() => setScreen("payment")} /> :

      screen === "payment" ?
      <PaymentScreen
        form={form}
        update={update}
        goTo={setScreen}
        onCancel={requestCancel}
        onPrevious={() => setScreen(isPickupOrder ? "docs" : "recipients")}
        onSubmit={() => setScreen("confirmation")} /> :


      <ConfirmationScreen form={form} onDone={goOrders} />
      }
      {showCancel ? <CancelModal onClose={() => setShowCancel(false)} onConfirm={goOrders} /> : null}
    </div>);

}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
