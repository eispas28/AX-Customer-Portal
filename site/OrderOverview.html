<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order Overview — ApostilleXpress</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="ds/tokens/fonts.css">
<link rel="stylesheet" href="ds/tokens/colors.css">
<link rel="stylesheet" href="ds/tokens/typography.css">
<link rel="stylesheet" href="ds/tokens/spacing.css">
<link rel="stylesheet" href="ds/tokens/shadows.css">
<link rel="stylesheet" href="ds/tokens/base.css">
<link rel="stylesheet" href="ds/components.css">
<link rel="stylesheet" href="ds/styles.css">
<script src="ds/_ds_bundle.js"></script>
<script src="./orderData.js"></script>
<link rel="stylesheet" href="ax-overlays.css">
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--ax-font-base);color:var(--ax-text-primary);background:var(--ax-surface-page);min-height:100vh}
/* ---- Top bar ---- */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:36px;height:72px;padding:0 40px;background:var(--ax-surface-card);border-bottom:1px solid var(--ax-border-subtle)}
.tb-logo{display:flex;align-items:center;flex-shrink:0}
.tb-nav{display:flex;align-items:center;gap:28px;flex:1}
.tb-link{display:inline-flex;align-items:center;gap:8px;font-size:16px;font-weight:500;color:var(--ax-text-tertiary);text-decoration:none;background:none;border:none;font-family:inherit;cursor:pointer;padding:0;transition:color .15s ease}
.tb-link i{font-size:18px}
.tb-link:hover{color:var(--ax-text-primary)}
.tb-link.active{color:var(--ax-sea-depths);font-weight:600}
.tb-profile-wrap{position:relative;flex-shrink:0}
.tb-profile-btn{display:inline-flex;align-items:center;gap:10px;font-size:16px;font-weight:500;color:var(--ax-text-primary);background:none;border:none;font-family:inherit;cursor:pointer;padding:6px 8px;border-radius:8px;transition:background .12s ease}
.tb-profile-btn:hover{background:var(--ax-gray-50)}
.tb-profile-btn i.bi-person-circle{font-size:22px;color:var(--ax-text-tertiary)}
.tb-profile-btn i.bi-chevron-down{font-size:14px;color:var(--ax-text-tertiary);transition:transform .15s ease}
.tb-profile-btn[aria-expanded="true"] i.bi-chevron-down{transform:rotate(180deg)}
.tb-menu{position:absolute;top:calc(100% + 10px);right:0;min-width:240px;background:var(--ax-surface-card);border:1px solid var(--ax-border-subtle);border-radius:12px;box-shadow:0 12px 24px -8px rgba(10,13,18,.18);padding:8px;z-index:40}
.tb-menu-item{display:flex;align-items:center;gap:13px;width:100%;padding:12px 14px;border-radius:8px;font-size:16px;font-weight:500;color:var(--ax-text-primary);text-decoration:none;background:none;border:none;font-family:inherit;cursor:pointer;text-align:left;transition:background .12s ease}
.tb-menu-item:hover{background:var(--ax-gray-50)}
.tb-menu-item i{font-size:18px;color:var(--ax-text-tertiary);width:20px;flex-shrink:0}
.tb-menu-sep{border:none;border-top:1px solid var(--ax-border-subtle);margin:6px 6px}
/* ---- Page ---- */
.page{max-width:1180px;margin:0 auto;padding:30px 40px 64px}
/* ---- Breadcrumb ---- */
.crumbs{display:flex;align-items:center;gap:8px;font-size:15px;margin-bottom:20px;flex-wrap:wrap}
.crumb{color:var(--ax-text-tertiary);text-decoration:none;padding:5px 12px;border-radius:7px;font-weight:600;transition:background .12s ease,color .12s ease}
a.crumb:hover{color:var(--ax-text-primary);background:var(--ax-gray-50)}
.crumb.active{background:var(--ax-gray-100);color:var(--ax-text-primary)}
.crumb-sep{color:var(--ax-text-tertiary);font-size:13px}
/* ---- Title block ---- */
.od-title{font-size:32px;font-weight:700;line-height:1.15;margin:0;letter-spacing:-.01em}
.od-meta{display:flex;align-items:center;gap:16px;margin-top:12px}
.od-meta .sep{width:1px;height:18px;background:var(--ax-border)}
.placed{font-size:16px;color:var(--ax-text-tertiary)}
.placed b{color:var(--ax-text-primary);font-weight:600}
.sbadge{display:inline-flex;align-items:center;padding:5px 13px;border-radius:6px;font-size:14px;font-weight:600;line-height:1.2}
.sbadge.new{background:var(--ax-info-50);color:var(--ax-info-700)}
.sbadge.pending{background:var(--ax-warning-50);color:var(--ax-warning-700)}
.sbadge.issued{background:var(--ax-success-50);color:var(--ax-success-700)}
.sbadge.cancelled,.sbadge.rejected,.sbadge.revoked{background:var(--ax-danger-50);color:var(--ax-danger-700)}
/* ---- Cards ---- */
.card{background:var(--ax-surface-card);border:1px solid var(--ax-border-subtle);border-radius:14px;box-shadow:var(--ax-shadow-xs)}
.card-head{padding:24px 28px;border-bottom:1px solid var(--ax-border-subtle)}
.card-head h2{font-size:22px;font-weight:700;margin:0}
.pay-body{padding:26px 28px;display:flex;flex-direction:column;gap:22px}
.pay-field .lbl{font-size:15px;color:var(--ax-text-tertiary);margin-bottom:9px}
.pay-method-val{display:flex;align-items:center;gap:12px;font-size:18px;font-weight:600;color:var(--ax-text-primary)}
.cc-visa{display:inline-flex;align-items:center;justify-content:center;height:24px;min-width:38px;padding:0 7px;border:1px solid var(--ax-border);border-radius:5px;font-size:11px;font-weight:800;letter-spacing:.02em;color:#1434CB;background:#fff}
.btn-secondary{display:inline-flex;align-items:center;gap:10px;background:var(--ax-surface-card);color:var(--ax-text-primary);border:1px solid var(--ax-border);border-radius:8px;padding:11px 18px;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;box-shadow:var(--ax-shadow-xs);transition:background .12s ease,border-color .12s ease;align-self:flex-start}
.btn-secondary:hover{background:var(--ax-gray-50)}
.btn-secondary:active{transform:translateY(.5px)}
.btn-secondary:focus-visible{outline:none;box-shadow:var(--ax-focus-ring)}
.btn-secondary i{font-size:17px;color:var(--ax-text-secondary)}
/* ---- Child table ---- */
.tcard{margin-top:24px;background:var(--ax-surface-card);border:1px solid var(--ax-border-subtle);border-radius:14px;box-shadow:var(--ax-shadow-xs);overflow:hidden}
.tcard-head{padding:22px 28px 0}
.tcard-head h2{font-size:20px;font-weight:700;margin:0}
.tcard-head p{font-size:15px;color:var(--ax-text-tertiary);margin:6px 0 0}
.tscroll{overflow:auto;max-height:430px}
.ctable{width:100%;border-collapse:collapse;min-width:820px}
.ctable thead th{position:sticky;top:0;z-index:2;background:var(--ax-surface-card)}
.ctable th{text-align:left;font-size:16px;font-weight:700;color:var(--ax-text-primary);padding:18px 18px 16px;border-bottom:1px solid var(--ax-border-subtle);white-space:nowrap}
.ctable th:first-child,.ctable td:first-child{padding-left:22px}
.ctable th:last-child,.ctable td:last-child{padding-right:22px}
.ctable td{font-size:16px;color:var(--ax-text-primary);padding:18px;border-bottom:1px solid var(--ax-border-subtle);white-space:nowrap}
.ctable tbody tr{cursor:pointer;transition:background .12s ease}
.ctable tbody tr:hover{background:var(--ax-gray-50)}
.ctable tbody tr:last-child td{border-bottom:none}
.ctable tbody tr:focus-visible{outline:none;background:var(--ax-gray-50);box-shadow:inset 3px 0 0 var(--ax-sea-depths)}
.ctable th.sortable{cursor:pointer;user-select:none}
.ctable .th-inner{display:inline-flex;align-items:center;gap:8px}
.ctable .th-inner .bi{font-size:15px;color:var(--ax-text-tertiary)}
.ctable .th-inner .bi.on{color:var(--ax-sea-depths)}
.rt{display:inline-flex;align-items:center;gap:8px}
.rt i{color:var(--ax-text-tertiary);font-size:16px}
@media (max-width:760px){
  .topbar{padding:0 18px;gap:18px}
  .tb-nav{gap:16px}
  .tb-link span{display:none}
  .page{padding:22px 18px 48px}
  .od-title{font-size:25px}
}
</style>
<link rel="stylesheet" href="ax-responsive.css">
<script src="./ax-mobile-nav.js" defer></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

function TopBar() {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  useEffect(() => {
    const onDoc = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    const onEsc = (e) => { if (e.key === "Escape") setOpen(false); };
    document.addEventListener("click", onDoc, true);
    document.addEventListener("keydown", onEsc);
    return () => { document.removeEventListener("click", onDoc, true); document.removeEventListener("keydown", onEsc); };
  }, []);
  return (
    <header className="topbar">
      <div className="tb-logo"><a className="tb-logo-link" href="Orders.dc.html" aria-label="ApostilleXpress — go to Orders"><img src="assets/logos/ax-wordmark.png" alt="ApostilleXpress" style={{ height: 30, width: "auto", display: "block" }} /></a></div>
      <nav className="tb-nav">
        <a className="tb-link active" href="Orders.dc.html"><i className="bi bi-list-task"></i><span>Orders</span></a>
        <a className="tb-link" href="CreateOrder.html"><i className="bi bi-plus-square"></i><span>Create New Order</span></a>
        <a className="tb-link" href="TeamManagement.html"><i className="bi bi-people"></i><span>Team</span></a>
      </nav>
      <div className="tb-profile-wrap" ref={ref}>
        <button className="tb-profile-btn" aria-haspopup="true" aria-expanded={open ? "true" : "false"} onClick={() => setOpen((o) => !o)}>
          <i className="bi bi-person-circle"></i><span>Maria Rodriguez</span><i className="bi bi-chevron-down"></i>
        </button>
        {open ? (
          <div className="tb-menu" role="menu">
            <a className="tb-menu-item" role="menuitem" href="Profile.html"><i className="bi bi-person"></i>My Profile</a>
            <a className="tb-menu-item" role="menuitem" href="https://www.gov-secure.com/apostille-xpress/" target="_blank" rel="noopener"><i className="bi bi-question-circle"></i>FAQ</a>
            <hr className="tb-menu-sep" />
            <a className="tb-menu-item" role="menuitem" href="CustomerAuth.dc.html"><i className="bi bi-box-arrow-right"></i>Log Out</a>
          </div>
        ) : null}
      </div>
    </header>
  );
}

function App() {
  const params = new URLSearchParams(window.location.search);
  const order = AXOrders.getOrder(params.get("order"));
  const parentStatus = AXOrders.parentStatus(order.children);
  const goChild = (number) => { window.location.href = "OrderDetails.html?order=" + encodeURIComponent(number); };

  const [sort, setSort] = useState({ key: null, dir: 1 });
  const COLS = [
    { key: "number", label: "Order Number", get: (c) => c.number },
    { key: "issuingState", label: "Issuing State", get: (c) => c.issuingState },
    { key: "requestType", label: "Request Type", get: (c) => c.requestType },
    { key: "serviceType", label: "Service Type", get: (c) => c.serviceType },
    { key: "referenceName", label: "Reference Name", get: (c) => c.referenceName || "—" },
    { key: "status", label: "Status", get: (c) => AXOrders.universalLabel(c.status) },
  ];
  const toggleSort = (key) => setSort((s) => (s.key === key ? { key, dir: -s.dir } : { key, dir: 1 }));
  const sortedChildren = React.useMemo(() => {
    if (!sort.key) return order.children;
    const col = COLS.find((c) => c.key === sort.key);
    return order.children.slice().sort((a, b) => {
      const av = String(col.get(a) == null ? "" : col.get(a));
      const bv = String(col.get(b) == null ? "" : col.get(b));
      return av.localeCompare(bv, undefined, { numeric: true, sensitivity: "base" }) * sort.dir;
    });
  }, [order.children, sort]);

  return (
    <div>
      <TopBar />
      <main className="page" data-screen-label="Order Overview">
        <nav className="crumbs" aria-label="Breadcrumb">
          <a className="crumb" href="Orders.dc.html">Orders</a>
          <i className="bi bi-chevron-right crumb-sep"></i>
          <span className="crumb active" aria-current="page">Order Overview</span>
        </nav>

        <h1 className="od-title">Order Overview #{order.number}</h1>
        <div className="od-meta">
          <span className={"sbadge " + AXOrders.parentClass(parentStatus)}>{parentStatus}</span>
          <span className="sep"></span>
          <span className="placed">Placed on <b>{order.placedOn}</b></span>
        </div>

        <div className="card" style={{ marginTop: 24 }}>
          <div className="card-head"><h2>Payment Information</h2></div>
          <div className="pay-body">
            <div className="pay-field">
              <div className="lbl">Payment method</div>
              <div className="pay-method-val"><span className="cc-visa">VISA</span>{order.payment.brand} ending in {order.payment.last4}</div>
            </div>
            <div className="pay-field">
              <div className="lbl">Receipt</div>
              <button className="btn-secondary" onClick={() => window.print()}><i className="bi bi-download"></i>Download Receipt</button>
            </div>
          </div>
        </div>

        <div className="tcard">
          <div className="tscroll">
            <table className="ctable">
              <thead>
                <tr>
                  {COLS.map((col) => (
                    <th key={col.key} className="sortable" onClick={() => toggleSort(col.key)} aria-sort={sort.key === col.key ? (sort.dir === 1 ? "ascending" : "descending") : "none"}>
                      <span className="th-inner">{col.label}<i className={"bi " + (sort.key === col.key ? (sort.dir === 1 ? "bi-chevron-up on" : "bi-chevron-down on") : "bi-chevron-expand")}></i></span>
                    </th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {sortedChildren.length === 0 ? (
                  <tr>
                    <td colSpan={COLS.length} style={{ textAlign: "center", padding: "48px 18px", color: "var(--ax-text-tertiary)", cursor: "default" }}>
                      <div style={{ fontSize: 16, fontWeight: 600, color: "var(--ax-text-primary)" }}>No apostilles in this order</div>
                      <div style={{ fontSize: 14, marginTop: 4 }}>Documents added to this order will appear here.</div>
                    </td>
                  </tr>
                ) : sortedChildren.map((c) => (
                  <tr key={c.number} tabIndex={0} onClick={() => goChild(c.number)}
                    onKeyDown={(e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); goChild(c.number); } }}>
                    <td><span className="rt">{c.number}</span></td>
                    <td>{c.issuingState}</td>
                    <td>{c.requestType}</td>
                    <td>{c.serviceType}</td>
                    <td>{c.referenceName || "—"}</td>
                    <td><span className={"sbadge " + AXOrders.universalClass(c.status)}>{AXOrders.universalLabel(c.status)}</span></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
